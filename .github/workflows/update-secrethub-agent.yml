name: Update SecretHub Agent

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-secrethub-agent
  cancel-in-progress: false

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Check latest SecretHub release
        id: agent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          nix_file="pkgs/secrethub-agent/default.nix"
          # SecretHub publishes release candidates as pre-releases, which
          # /releases/latest excludes. Use the newest non-draft release.
          releases_json="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/gsmlg-dev/secrethub/releases?per_page=20")"
          release_json="$(jq -c '[.[] | select(.draft | not)] | sort_by(.published_at) | last' <<< "$releases_json")"

          tag="$(jq -r '.tag_name' <<< "$release_json")"
          # The tag is interpolated into Perl substitutions and the commit message.
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Unexpected gsmlg-dev/secrethub release tag: ${tag}"
            exit 1
          fi

          version="${tag#v}"
          current_version="$(grep -Po '^\s*version\s*=\s*"\K[^"]+' "$nix_file")"

          declare -A hashes
          for arch in linux-amd64 linux-arm64; do
            asset="secrethub_agent-${tag}-${arch}.tar.gz"
            digest="$(jq -r --arg asset "$asset" '.assets[] | select(.name == $asset) | .digest' <<< "$release_json")"
            if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Release ${tag} does not contain a sha256 digest for asset ${asset}"
              exit 1
            fi

            digest_hex="${digest#sha256:}"
            hashes[$arch]="sha256-$(perl -MMIME::Base64 -e 'print encode_base64(pack("H*", $ARGV[0]), "")' "$digest_hex")"
          done

          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          cp "$nix_file" "${tmpdir}/default.nix.before"

          perl -0pi -e "s/version = \"[^\"]+\"/version = \"${version}\"/" "$nix_file"
          perl -0pi -e 's#(name = "linux-amd64";\n\s*hash = ")[^"]+(")#${1}'"${hashes[linux-amd64]}"'${2}#' "$nix_file"
          perl -0pi -e 's#(name = "linux-arm64";\n\s*hash = ")[^"]+(")#${1}'"${hashes[linux-arm64]}"'${2}#' "$nix_file"

          if cmp -s "$nix_file" "${tmpdir}/default.nix.before"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "SecretHub Agent is up to date (${current_version})"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "current_version=${current_version}" >> "$GITHUB_OUTPUT"
            echo "SecretHub Agent update detected: ${current_version} -> ${version}"
          fi

      - name: Commit and push
        if: steps.agent.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.agent.outputs.version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pkgs/secrethub-agent/default.nix
          git commit -m "feat(secrethub-agent): update to ${VERSION}"
          git push origin HEAD:main
